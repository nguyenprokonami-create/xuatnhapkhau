<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | IMEX Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-container">
    <header class="login-header">
      <div class="login-logo">IM</div>
      <h1>IMEX Manager</h1>
      <p class="muted">Hệ thống quản lý xuất nhập khẩu</p>
    </header>

    <form action="index.html" method="post">
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" placeholder="Nhập tên đăng nhập" required>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" required>
      </div>

      <button class="btn btn-primary" type="submit">Đăng nhập</button>
    </form>

    <footer class="login-footer">
      Dữ liệu đăng nhập mô phỏng giao diện frontend.
    </footer>
  </main>
  <script src="js/app.js" defer></script>
</body>
</html>
